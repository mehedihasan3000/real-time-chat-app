[package]
name = "chat-olm-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Thin project-owned WASM binding over vodozemac 0.11.2 Olm (P2-02, DEC-018)."

[lib]
crate-type = ["cdylib"]

[dependencies]
vodozemac = { version = "=0.11.2", default-features = false }
getrandom = { version = "0.4" }
serde_json = { version = "1.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
