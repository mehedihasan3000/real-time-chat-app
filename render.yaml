# Render Blueprint for the free-tier staging API (P0-10).
# Spec: https://render.com/docs/blueprint-spec
#
# This file contains no secrets. Values marked `sync: false` must be entered in
# the Render dashboard before the first successful deploy. The service is
# intentionally fail-closed: apps/api/src/config.ts rejects production startup
# until the real staging origins, Atlas URI, auth secret, and Groq key are
# present. The prototype is STUN-only; TURN is optional and deferred (CC-011).
#
# Free-tier boundaries: plan `free`, Singapore region, one instance, no
# persistent disk, no shell. The service spins down after 15 minutes idle and
# drops sockets. This is prototype/staging only, not beta capacity evidence.

services:
  - type: web
    name: real-time-chat-api-staging
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # NODE_ENV=production makes npm omit devDependencies by default. The build
    # needs TypeScript and @types/node, so include devDependencies explicitly.
    buildCommand: npm ci --include=dev && npm run build -w @chat/contracts && npm run build -w @chat/api
    startCommand: npm run start -w @chat/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Set to the Vercel staging origin, for example
      # https://real-time-chat-web-staging.vercel.app
      - key: APP_ORIGIN
        sync: false
      # Set to this Render service's public origin, for example
      # https://real-time-chat-api-staging.onrender.com
      - key: API_ORIGIN
        sync: false
      # Atlas M0 connection string. Use a dedicated staging user and database.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: real_time_chat_staging
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: "5000"
      # Generate a staging-only 32-byte base64 secret; never reuse local values.
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false
      - key: AI_CONSENT_REQUIRED
        value: "true"
      # STUN-only prototype. TURN is deferred under CC-011. To add TURN later,
      # add TURN_URLS, TURN_USERNAME, TURN_CREDENTIAL, and TURN_REALM as
      # `sync: false` entries and redeploy; no application code change is needed.
      - key: STUN_URLS
        value: "stun:stun.cloudflare.com:3478"
      # - key: TURN_URLS
      #   sync: false
      # - key: TURN_USERNAME
      #   sync: false
      # - key: TURN_CREDENTIAL
      #   sync: false
      # - key: TURN_REALM
      #   sync: false
      # - key: TURN_CREDENTIAL_TTL_SECONDS
      #   value: "7200"
